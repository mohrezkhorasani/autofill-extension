<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>صفحه تست اکستنشن Autofill</title>
  <style>
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h2 { margin-bottom: 20px; font-size: 18px; color: #6366f1; }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-size: 12px; color: #94a3b8; font-weight: 600; }
    input, textarea {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #6366f1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>تست فرم و عملکرد Autofill</h2>
    <div class="form-group">
      <label for="name">نام و نام خانوادگی:</label>
      <input type="text" id="name" placeholder="روی فیلد کلیک کنید..." />
    </div>

    <div class="form-group">
      <label for="national_id">کد ملی:</label>
      <input type="text" id="national_id" placeholder="کد ملی..." />
    </div>

    <div class="form-group">
      <label for="email">پست الکترونیکی (Email):</label>
      <input type="email" id="email" placeholder="ایمیل خود را وارد کنید..." />
    </div>

    <div class="form-group">
      <label for="card">شماره کارت یا شبا:</label>
      <input type="text" id="card" placeholder="شماره کارت..." />
    </div>

    <div class="form-group">
      <label for="address">آدرس پستی یا توضیحات:</label>
      <textarea id="address" rows="3" placeholder="آدرس..."></textarea>
    </div>
  </div>
</body>
</html>
